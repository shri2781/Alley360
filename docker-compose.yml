services:
  db:
    image: postgres:16-alpine
    container_name: bowling-db
    environment:
      POSTGRES_USER: bowling
      POSTGRES_PASSWORD: bowling
      POSTGRES_DB: bowling
    ports:
      - "5433:5432"
    volumes:
      - bowling-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bowling -d bowling"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bowling-pgdata:
